set -sg escape-time 10
set -g focus-events on

# set -g default-terminal "xterm-256color"
# set -as terminal-overrides ',xterm-256color:Tc'
set -g default-terminal "tmux-256color"

set -as terminal-features 'xterm-256color:RGB:clipboard'
set -as terminal-features 'xterm-ghostty:RGB:clipboard'

set -s theme terminal
set -g popup-style default
set -g popup-border-style default

# Start pane indices from 1
set -g base-index 1
setw -g pane-base-index 1

set -g status-style "bg=default,fg=white"           # whole bar; bg=default = transparent
set -g status-style bg=default   # transparent, your Ghostty image shows through
set -g status-bg default
#set -g status-right "#[fg=cyan]#(tms sessions) #[fg=colour245]%H:%M"
#setw -g window-status-current-format "#[fg=black,bg=yellow] #I:#W "

# set -g status-left-style "fg=yellow,bold"         # color only, keeps [name]
set -g status-left "[#[fg=yellow,bold]#S#[default]] "

set -g status-right " #(tms sessions)"
set -g status-interval 5
set -g status-right "#{?client_prefix,#[reverse] PREFIX #[noreverse] ,}#{?pane_in_mode,#[reverse] COPY #[noreverse] ,}#{?window_zoomed_flag,#[fg=yellow]ZOOM#[default] ,}#{pane_current_command} #{b:pane_current_path}"

# set -g status-left-length 75
set -g window-status-current-style "fg=brightmagenta,bold"
set -g window-status-current-style "fg=white,bold"

set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=#{?pane_modal_flag,themeblue,#{?pane_marked,thememagenta,#{?synchronize-panes,themered,#{?pane_in_mode,themeyellow,colour244}}}}"

set -g message-style "fg=white,bg=default,fill=default"
set -g message-style "fg=white,bg=colour236,fill=colour236"

set -g set-clipboard on
set -gq allow-passthrough on
set -g focus-events on

# Disables visual notifications when there's activity in other tmux windows
set -g visual-activity off

set -g extended-keys on
#set -s extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'xterm-ghostty:extkeys'

set-window-option -g mode-keys vi
# bind -T copy-mode-vi v send-keys -X begin-selection
# bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

bind -T copy-mode-vi WheelUpPane   send -N 1 -X scroll-up
bind -T copy-mode-vi WheelDownPane send -N 1 -X scroll-down

# vim-like pane switching
bind -r ^ last-window
bind -r k select-pane -U
bind -r j select-pane -D
bind -r h select-pane -L
bind -r l select-pane -R

bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# forget the find window.  That is for chumps
# bind-key -r f run-shell "tmux neww ~/.dotfiles/.local/bin/sessionizer"

bind -n M-Left select-pane -L
bind -n M-Down select-pane -D
bind -n M-Up select-pane -U
bind -n M-Right select-pane -R

# tmux-sessionizer
bind j popup -E "tms"
bind J popup -E "tms switch"
bind č popup -E "tms kill"

bind -r '(' switch-client -p\; refresh-client -S
bind -r ')' switch-client -n\; refresh-client -S
# end tmux-sessionizer

# Turn the mouse on
set -g mouse on
# unbind -n MouseDrag1Pane
# unbind -Tcopy-mode MouseDrag1Pane

# Toggle mouse on with ^B a
# bind a \
  set -g mouse on \;\
  send-keys Escape \;\
  display 'Mouse: ON'

# Toggle mouse off with ^B A
# bind A \
  set -g mouse off \;\
  send-keys Escape \;\
  display 'Mouse: OFF'



# Bind inline sessionizer
bind e display-popup -E "\
  tmux list-sessions -F '#{?session_attached,,#{session_name}}' |\
  sed '/^$/d' |\
  fzf --reverse --header jump-to-session |\
  xargs tmux switch-client -t"

bind f display-popup -E "\
  tmux list-panes -s -F '#{session_name}:#{window_index}.#{pane_index} #{pane_current_path} #{pane_current_command}' |\
  sed '/^$/d' |\
  fzf --reverse --header jump-to-pane |\
  cut -d ' ' -f 1 |\
  xargs tmux select-pane -t"
# End of inline sessionizer bindings


# set -g update-environment "DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_CONNECTION WINDOWID XAUTHORITY"
# set-environment -g 'SSH_AUTH_SOCK' ~/.ssh/ssh_auth_sock
# set -g update-environment -r
set-environment -g SSH_AUTH_SOCK $HOME/.ssh/ssh_auth_sock
set-environment -g SSH_AGENT_PID $HOME/.ssh/agent-environment

set-environment -g TMUX_PLUGIN_MANAGER_PATH "~/.tmux/plugins/"


# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'

set -g @plugin 'jrmoulton/tmux-sessionizer'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
